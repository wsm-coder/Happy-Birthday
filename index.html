
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❄️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <audio id="bgMusic" loop autoplay>
    <source src="HAPPY BIRTHDAY TO YOU _ PIANO INSTRUMENTAL _ BEST HAPPY BITHDAY MUSIC 2021.mp3" type="audio/mpeg">
    </audio>

    <main id="scenes">

        <!-- SCENE 1 -->

        <section class="scene scene-1">

            <div class="ice-particles"></div>
            <div class="sky-glow"></div>

            <div class="rigel-star">
                <div class="heatwave"></div>
                <div class="heatwave"></div>
                <div class="heatwave"></div>
            </div>

            <div class="orbit-wrapper">

                <div class="orbit-wrapper">

                    <svg class="birthday-orbit" viewBox="0 0 700 700">
                        <defs>
                            <path
                                id="birthdayCircle1"
                                d="M 350,350
                                   m -275,0
                                   a 275,275 0 1,1 550,0
                                   a 275,275 0 1,1 -550,0"
                            />
                        </defs>

                        <text class="birthday-orbit-text">
                            <textPath
                                href="#birthdayCircle1"
                                startOffset="50%"
                                text-anchor="middle">
                                Happy Birthday
                            </textPath>
                        </text>
                    </svg>

                    <svg class="marina-orbit" viewBox="0 0 700 700">
                        <defs>
                            <path
                                id="birthdayCircle2"
                                d="M 350,350
                                   m -275,0
                                   a 275,275 0 1,1 550,0
                                   a 275,275 0 1,1 -550,0"
                            />
                        </defs>

                        <text class="marina-orbit-text">
                            <textPath
                                href="#birthdayCircle2"
                                startOffset="50%"
                                text-anchor="middle">
                                Marina
                            </textPath>
                        </text>
                    </svg>

                </div>

            </div>

            <div class="scene-content"></div>

            <span class="scroll-text">
                Scroll to begin
                <span class="arrow">↓</span>
            </span>

        </section>


        <!-- SCENE 2 -->

        <section class="scene scene-2">

            <div class="snow"></div>

            <div class="distant-glow"></div>

            <div class="valley-sky"></div>

            <div class="mountain-layer mountain-layer-far"></div>

            <div class="mountain-layer mountain-layer-middle"></div>

            <div class="mountain-layer mountain-layer-near"></div>

            <div class="mountain-snow-caps"></div>

            <div class="horizon-fog"></div>

            <div class="snow-valley"></div>

            <div class="valley-highlight"></div>

            <div class="scene-2-particles"></div>

            <div class="scene-content">

                <div class="snowflake-symbol">
                    ❄
                </div>

                <h2>
                    Welcome to winter
                </h2>

                <p class="scene-description">
                    Something special is waiting beyond the snow...
                </p>

            </div>

        </section>


        <!-- SCENE 3 -->

        <section class="scene scene-3">

            <div class="scene-3-glow"></div>

            <div class="scene-3-stars"></div>

            <!-- RUSSIAN CATHEDRAL -->

         <img
         src="saint-basils-cathedral-clipart-20.jpg"
         alt="Russian-style cathedral"
         style="width:600px !important; height:auto !important; max-width:700px; z-index: 6 !important;">


            <div class="scene-3-hills"></div>

            <div class="scene-3-ground"></div>

            <div class="scene-3-mist"></div>


            <!-- ONE SINGLE SNOWMAN -->

            <img src="https://www.freeiconspng.com/uploads/snowman-png-5.png"
                 class="snowman"
                 alt="Snowman">


            <div class="scene-3-content">

                <p>
                    Look closely...
                </p>

                <h2>
                    Someone was waiting for you.
                </h2>

            </div>

        </section>


        <!-- SCENE 4 -->

        <section class="scene scene-4">

    <div class="falling-stars"></div>


    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>
    <div class="aurora aurora-three"></div>

    <div class="night-stars"></div>

    <div class="frozen-mountains">
        <div class="frozen-mountain frozen-mountain-one"></div>
        <div class="frozen-mountain frozen-mountain-two"></div>
        <div class="frozen-mountain frozen-mountain-three"></div>
    </div>

    <div class="lake-horizon"></div>

    <div class="frozen-lake">
        <div class="lake-reflection"></div>
    </div>

    <div class="scene-4-snow"></div>

    <div class="scene-4-content">

        <div class="scene-4-content">

    <p class="scene-4-small word-drop">
        <span>Before</span>
        <span>we</span>
        <span>reach</span>
        <span>the</span>
        <span>end...</span>
    </p>

    <h2 class="word-drop">
        <span>Make</span>
        <span>a</span>
        <span>wish.</span>
    </h2>

 </div>

    </div>

 </section>


        <!-- SCENE 5 -->

 <!-- SCENE 5 -->

 <section class="scene scene-5">

    <div class="final-glow"></div>

    <div class="confetti-container"></div>

    <div class="final-particles"></div>

    <div class="final-light"></div>

    <div class="scene-5-content">

        <div class="final-cake">

    <div class="cake-glow"></div>

    <img
        src="birthday-8547107_1280.png"
        class="cake-icon"
        alt="Birthday cake">

        <div class="final-title">

            <span>❄️HAPPY</span>
            <span>BIRTHDAY❄️</span>

        </div>

        <div class="final-name">
            ⛄Marina⛄
        </div>

        <div class="final-line"></div>
        
    </div>

    <div class="credits">
    <div>Website Made By <span>Draze</span></div>
    <div>Surprise Planned By <span>Abdou</span></div>
</div>

</div>

</section> 
    </main>

    <script src="script.js"></script>

</body>

</html>
